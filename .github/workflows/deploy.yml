name: Deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  DOMAIN: dash.breakprotection.com
  # Port the app listens on at 127.0.0.1 on the server; the host's nginx
  # proxies dash.breakprotection.com to it (8000 is the old bare-metal app).
  APP_PORT: "8010"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Type-check and build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Backend tests
        working-directory: backend
        env:
          JWT_SECRET_KEY: ci-only-not-a-real-secret
        run: |
          pip install -r requirements.txt aiosqlite
          python -m pytest tests -q

  build-and-push:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.name.outputs.image }}
    steps:
      - uses: actions/checkout@v4
      - name: Image name (registry paths must be lowercase)
        id: name
        run: echo "image=${REGISTRY}/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push app image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.name.outputs.image }}:latest,${{ steps.name.outputs.image }}:${{ github.sha }}
          cache-from: type=gha,scope=app
          cache-to: type=gha,scope=app,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4

      - name: Check required secrets
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
          APP_ENV: ${{ secrets.APP_ENV }}
          GOOGLE_SA_JSON: ${{ secrets.GOOGLE_SA_JSON }}
          DB_ROOT_PASSWORD: ${{ secrets.DB_ROOT_PASSWORD }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        run: |
          missing=0
          for s in SERVER_HOST SERVER_USER SERVER_SSH_KEY APP_ENV GOOGLE_SA_JSON DB_ROOT_PASSWORD DB_PASSWORD; do
            if [ -z "${!s}" ]; then echo "::error::GitHub secret $s is not set"; missing=1; fi
          done
          # DB_PASSWORD goes inside the database URL, so keep it URL-safe.
          if ! printf '%s' "$DB_PASSWORD" | grep -Eq '^[A-Za-z0-9]{16,}$'; then
            echo "::error::DB_PASSWORD must be 16+ letters/digits only (e.g. openssl rand -hex 24)"; missing=1
          fi
          exit $missing

      # Multi-line values travel to the server base64-encoded so newlines and
      # quotes in app.env / the Google key survive the SSH hop intact.
      - name: Encode multi-line secrets
        env:
          APP_ENV: ${{ secrets.APP_ENV }}
          GOOGLE_SA_JSON: ${{ secrets.GOOGLE_SA_JSON }}
        run: |
          a=$(printf '%s' "$APP_ENV" | base64 -w0); echo "::add-mask::$a"; echo "APP_ENV_B64=$a" >> "$GITHUB_ENV"
          g=$(printf '%s' "$GOOGLE_SA_JSON" | base64 -w0); echo "::add-mask::$g"; echo "GOOGLE_SA_B64=$g" >> "$GITHUB_ENV"

      - name: Copy compose file to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_SSH_PORT || 22 }}
          source: docker-compose.yml
          target: ${{ secrets.DEPLOY_PATH || '/opt/bp-analytics' }}

      - name: Write config, migrate database, restart containers
        uses: appleboy/ssh-action@v1.2.0
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH || '/opt/bp-analytics' }}
          APP_IMAGE: ${{ needs.build-and-push.outputs.image }}:${{ github.sha }}
          DOMAIN: ${{ env.DOMAIN }}
          APP_PORT: ${{ env.APP_PORT }}
          DB_ROOT_PASSWORD: ${{ secrets.DB_ROOT_PASSWORD }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_SSH_PORT || 22 }}
          command_timeout: 20m
          envs: GHCR_USER,GHCR_TOKEN,DEPLOY_PATH,APP_IMAGE,DOMAIN,APP_PORT,DB_ROOT_PASSWORD,DB_PASSWORD,APP_ENV_B64,GOOGLE_SA_B64
          script: |
            set -e
            cd "$DEPLOY_PATH"
            mkdir -p secrets backups
            chmod 700 secrets
            umask 077

            # Compose variables (image tag, domain, port, database passwords)
            {
              echo "APP_IMAGE=$APP_IMAGE"
              echo "DOMAIN=$DOMAIN"
              echo "APP_PORT=$APP_PORT"
              echo "DB_ROOT_PASSWORD=$DB_ROOT_PASSWORD"
              echo "DB_PASSWORD=$DB_PASSWORD"
            } > .env
            # App settings (JWT secret, MCP, SMTP, Meta…) from the APP_ENV secret
            printf '%s' "$APP_ENV_B64" | base64 -d > app.env
            printf '%s' "$GOOGLE_SA_B64" | base64 -d > secrets/google-sa.json
            # the container runs as a non-root user; the secrets dir stays 700
            chmod 644 secrets/google-sa.json

            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            docker compose pull
            docker compose up -d --wait db

            # The core tables come from the one-time import of the existing
            # database (docs/DEPLOYMENT.md), not from migrations — refuse to
            # migrate an empty database rather than half-build it.
            tables=$(docker compose exec -T db mariadb -u root -p"$DB_ROOT_PASSWORD" -N -e \
              "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema='bp_analytics' AND table_name='users'")
            if [ "$tables" != "1" ]; then
              echo "::error::Database is empty. Import the existing database once (docs/DEPLOYMENT.md, step 4), then re-run this workflow."
              docker logout ghcr.io
              exit 1
            fi

            echo "Running database migrations…"
            docker compose run --rm --no-deps app alembic upgrade head

            docker compose up -d --remove-orphans --wait
            curl -fsS "http://127.0.0.1:$APP_PORT/health" && echo " ← app healthy on 127.0.0.1:$APP_PORT"
            docker logout ghcr.io
            docker image prune -f
            docker compose ps
